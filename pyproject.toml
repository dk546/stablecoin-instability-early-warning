[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stablecoin-instability-early-warning"
version = "1.0.0"
description = "Research code for explainable early-warning models of stablecoin instability"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
authors = [{name = "Denis Kyalo"}]
keywords = ["stablecoins", "early-warning", "machine-learning", "explainability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "lightgbm==4.6.0",
  "matplotlib==3.10.1",
  "numpy==2.0.2",
  "pandas==2.2.2",
  "pyarrow==18.1.0",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "shap==0.52.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
